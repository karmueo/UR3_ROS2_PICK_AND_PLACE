# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: position_controllers/GripperActionController

    forward_command_controller_effort:
      type: forward_command_controller/ForwardCommandController

    impedance_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # arm_with_gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 5.0
gripper_controller:
  ros__parameters:
    # 抓取侧关节（Robotiq 2F-85 的驱动关节，其余指节由 URDF mimic 跟随）
    joint: finger_joint
    # GripperActionController 正确参数名是 default_tolerance（非 default_goal_tolerance）
    # 放宽到 0.1 rad：commanded 0.22 在物理阻塞于 ~0.18 时仍判为 reached，立即结束 action
    default_tolerance: 0.1
    # 失速作为备选成功路径（速度 < 阈值 持续 timeout 秒后，即使未到 tolerance 也算成功）
    stall_velocity_threshold: 0.08
    stall_timeout: 1.0
    allow_stalling: true
